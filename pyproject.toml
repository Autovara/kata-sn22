[project]
name = "kata-sn22"
version = "0.1.0"
description = "SN22 (Desearch) subnet plugin for the Kata competition platform (skeleton)."
requires-python = ">=3.12"
dependencies = [
  "kata",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Discovered by the Kata platform via the kata.subnets entry-point group.
[project.entry-points."kata.subnets"]
sn22 = "kata_sn22:SN22_DESEARCH_PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kata_sn22"]

[tool.uv.sources]
kata = { path = "../kata", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
