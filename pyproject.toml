[project]
name = "kata-sn22"
version = "0.1.0"
description = "SN22 (Desearch) subnet plugin for the Kata competition platform (skeleton)."
requires-python = ">=3.12"
dependencies = [
  "kata",
  "dcap-qvl==0.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Only the parity harness needs these: it imports the pinned upstream under tools/upstream_shim.py
# to record what the real upstream computes. The lane runtime imports kata_sn22.upstream_adapter,
# which has no third-party dependency, so none of this reaches production.
parity = ["pytest>=8.0", "ruff>=0.6", "pydantic>=2.0", "pytz", "numpy"]

# Discovered by the Kata platform via the kata.subnets entry-point group.
[project.entry-points."kata.subnets"]
sn22 = "kata_sn22:SN22_DESEARCH_PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `kata_sn22_sdk` is the AGENT-side package: it ships into the agent image by COPY, not by
# pip, but it is part of this repository's deliverable and its tests import it. It carries no
# credential, no scorer and no judge prompt, so an installed copy beside the lane is inert.
packages = ["kata_sn22", "kata_sn22_sdk"]

[tool.uv.sources]
kata = { path = "../kata", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# The pinned upstream snapshot is EVIDENCE, not our source. Linting it would be meaningless (it is
# someone else's style) and formatting it would break the tree digest the parity gate depends on.
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The vendored upstream ships its own test suite. It is part of the pinned tree and must stay
# byte-identical, but it is not ours to run: it needs bittensor, a wallet and a network.
norecursedirs = ["upstream", ".venv", "dist"]
filterwarnings = [
    # Raised while importing the pinned upstream's pydantic models under the parity shim. Not ours
    # to fix, and pinning the tree means it cannot be fixed here without invalidating the evidence.
    "ignore:.*allow_mutation.*:DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
